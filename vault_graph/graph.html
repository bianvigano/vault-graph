<!doctype html>
<html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas Pengetahuan</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c111b;color:#e5ecf6;font:14px system-ui,sans-serif}button,input,select{font:inherit}button,select{cursor:pointer;background:#192435;border:1px solid #344259;color:#e5ecf6;border-radius:8px;padding:9px 12px}button:hover,button:focus-visible{border-color:#64dac6;background:#24364a}header{height:84px;border-bottom:1px solid #263246;padding:18px 26px;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0 0 4px}small,.muted{color:#99a9be}main{display:grid;grid-template-columns:1fr 320px;height:calc(100vh - 84px)}#workspace{position:relative;min-width:0;background:radial-gradient(ellipse at center,#152236 0,#0c111b 75%)}#toolbar{position:absolute;top:18px;left:22px;right:22px;display:flex;gap:8px;flex-wrap:wrap;z-index:2}input{background:#101b2b;border:1px solid #344259;border-radius:8px;padding:10px 12px;color:white;min-width:180px;flex:1}svg{width:100%;height:100%;display:block}.edge{stroke:#91accb;stroke-opacity:.55;stroke-width:1;vector-effect:non-scaling-stroke}.node{cursor:pointer}.node{transition:opacity 260ms ease}.node circle{transition:r 260ms ease,fill 260ms ease,filter 260ms ease,stroke-width 260ms ease}.node text{fill:#dce6f3;font-size:12px;paint-order:stroke;stroke:#101a28;stroke-width:4px;pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity 220ms ease,transform 220ms ease}.node text.visible{opacity:1;transform:translateY(0)}.edge{transition:opacity 260ms ease,stroke 260ms ease,stroke-width 260ms ease}.node.selected circle{filter:drop-shadow(0 0 8px #66d9c4);stroke:#fff;stroke-width:3}.node.related circle{filter:drop-shadow(0 0 5px #79aaff)}.node:focus circle{stroke:white;stroke-width:3}aside{background:#101925;border-left:1px solid #263246;overflow:auto;padding:24px}h2{font-size:18px;line-height:1.5;margin-top:0;overflow-wrap:anywhere}h3{font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:#99a9be;margin-top:26px}.item{display:block;text-align:left;width:100%;margin:7px 0;overflow-wrap:anywhere}.path{font:11px monospace;overflow-wrap:anywhere;color:#99a9be;line-height:1.8}#status{position:absolute;bottom:20px;left:24px;color:#99a9be;pointer-events:none}.badge{display:inline-block;border:1px solid #344259;border-radius:20px;padding:5px 9px;margin:3px;color:#a6e8dc}#query{width:100%;min-width:0;margin-top:12px}.empty{line-height:1.8;color:#99a9be}@media(max-width:760px){main{grid-template-columns:1fr;height:auto}#workspace{height:65vh}aside{border-left:0;border-top:1px solid #263246;max-height:45vh}header{padding:16px}#toolbar{left:12px;right:12px}header small{display:none}}

.icon-button{position:relative;display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;padding:9px;flex:none}.icon-button svg{width:20px;height:20px;display:block}.icon-button[aria-pressed="true"]{color:#66d9c4;border-color:#66d9c4;background:#203b40}.icon-button::after{content:attr(data-tip);position:absolute;top:calc(100% + 9px);left:50%;transform:translate(-50%,-4px);background:#243449;color:#eef5ff;border:1px solid #465a74;border-radius:6px;padding:6px 9px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity 150ms,transform 150ms;z-index:30}.icon-button:hover::after,.icon-button:focus-visible::after{opacity:1;transform:translate(-50%,0)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header><div><h1>Atlas Pengetahuan</h1><small>Jelajahi topik, temukan hubungan, buka konteks.</small></div><span id="total" class="badge"></span></header>
<main><section id="workspace" aria-label="Visualisasi hubungan"><div id="toolbar"><button id="home" class="icon-button" aria-label="Semua hubungan" data-tip="Semua hubungan"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button><input id="search" aria-label="Cari pengetahuan" placeholder="Cari judul atau path…"><select id="type" aria-label="Filter tipe"><option value="">Semua tipe</option></select><button id="fit" class="icon-button" aria-label="Pas-kan ke layar" data-tip="Pas-kan ke layar"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button><button id="unlock" class="icon-button" aria-label="Lepaskan posisi" data-tip="Lepaskan posisi" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m8 5 11 7-11 7z"/></svg></button><button id="reset" class="icon-button" aria-label="Reset layout" data-tip="Reset layout"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button><button id="isolated" class="icon-button" aria-label="Tampilkan node terisolasi" data-tip="Tampilkan node terisolasi" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="4" cy="4" r="1"/><circle cx="20" cy="4" r="1"/><circle cx="4" cy="20" r="1"/><circle cx="20" cy="20" r="1"/></svg></button></div><svg role="img" aria-label="Graph pengetahuan"></svg><div id="status" role="status"></div></section><aside><h2 id="title">Pilih sebuah topik</h2><div id="detail" class="empty">Mulai dari kelompok di sebelah kiri. Pilih node untuk melihat koneksi dan sumbernya.</div><h3>Cari jalur</h3><input id="query" aria-label="Perintah graph" placeholder="path A to B / explain A"><button id="run" class="icon-button" aria-label="Jalankan pencarian jalur" data-tip="Jalankan pencarian jalur"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 14 0m-6-6 6 6-6 6"/></svg></button><p class="muted">Gulir untuk zoom · tarik untuk geser<br>Enter pada node untuk membuka detail.</p></aside></main>
<script type="module">
let raw;
try {
  const response = await fetch('./graph.json');
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  raw = await response.json();
  if (!Array.isArray(raw.nodes) || !Array.isArray(raw.edges)) throw new Error('Format graph.json tidak valid');
} catch (error) {
  document.getElementById('detail').textContent = `Data gagal dimuat: ${error.message}. Buka melalui server lokal: python3 -m http.server 8765 --bind 127.0.0.1 --directory /home/the-meh/Documents/vault-graph/vault-out`;
  throw error;
}
const $=id=>document.getElementById(id), svg=d3.select('#workspace > svg'), layer=svg.append('g'); // target graph, bukan SVG ikon toolbar
const endpoint=x=>typeof x==='object'?x.id:x;
const palette=['#66d9c4','#79aaff','#d5a0fa','#f2c879','#f58e9c','#86ceb7','#9eb8ed'];
function clean(value){const el=document.createElement('textarea');let s=String(value||'');for(let i=0;i<8;i++){el.innerHTML=s;const next=el.value;if(next===s)break;s=next;}return s.replace(/(?:amp;?){2,}/g,'').replace(/\s+/g,' ').trim();}
const nodes=raw.nodes.map(n=>({...n,label:clean(n.label||n.id).split(/[\\/]/).pop().replace(/\.md$/i,'').replace(/[-_]/g,' ')}));
const map=new Map(nodes.map(n=>[n.id,n])), adj=new Map(nodes.map(n=>[n.id,[]]));
const edges=raw.edges.filter(e=>map.has(endpoint(e.source))&&map.has(endpoint(e.target))).map(e=>({...e,source:endpoint(e.source),target:endpoint(e.target)}));
for(const e of edges){adj.get(e.source).push(e.target);adj.get(e.target).push(e.source);}
function topic(n){const parts=n.id.replace(/^.*?\/vault\//,'').split('/');if(n.id.startsWith('trae:'))return 'Trae';if(['sessions','concepts','wiki'].includes(parts[0]))return parts.length>2?parts[1]:parts[0];return n.type||'other';}
const groups=d3.group(nodes,topic), colors=new Map([...groups.keys()].sort().map((k,i)=>[k,palette[i%palette.length]]));
function setMotionIcon(active){const b=$('unlock');b.querySelector('svg').innerHTML=active?'<path d="M8 5v14M16 5v14"/>':'<path d="m8 5 11 7-11 7z"/>';b.dataset.tip=active?'Hentikan gerakan':'Lepaskan posisi';b.setAttribute('aria-label',b.dataset.tip);}
let simulation, current=null, selected=null, showIsolated=false, released=false;
$('total').textContent=`${nodes.length} node · ${edges.length} relasi`;
for(const t of [...new Set(nodes.map(n=>n.type||'other'))].sort()){const o=document.createElement('option');o.value=t;o.textContent=t;$('type').append(o);}
const zoom=d3.zoom().scaleExtent([.12,5]).on('zoom',e=>{layer.attr('transform',e.transform);updateLabels(e.transform.k);});svg.call(zoom);
function updateLabels(scale){layer.selectAll('.node text').classed('visible',d=>selected===d.id||scale>=2||(scale>=1.25&&(adj.get(d.id)?.length||0)>=5));}
function fit(){const box=layer.node().getBBox(), rect=svg.node().getBoundingClientRect();if(!box.width)return;const scale=Math.min(1.5,(rect.width-100)/box.width,(rect.height-150)/box.height);svg.transition().duration(350).call(zoom.transform,d3.zoomIdentity.translate(rect.width/2-scale*(box.x+box.width/2),rect.height/2+30-scale*(box.y+box.height/2)).scale(scale));}
function render(list,links,overview=false){if(simulation)simulation.stop();layer.selectAll('*').remove();const rect=svg.node().getBoundingClientRect();const view=list.map(n=>({...n})), line=layer.append('g').selectAll('line').data(links.map(e=>({...e}))).join('line').attr('class','edge').attr('stroke-dasharray',d=>d.confidence==='INFERRED'?'4 5':null);
const node=layer.append('g').selectAll('g').data(view).join('g').attr('class','node').attr('tabindex',0).attr('role','button').attr('aria-label',d=>d.label).on('click',(_,d)=>overview?openGroup(d.id):showNode(d.id)).on('keydown',(e,d)=>{if(e.key==='Enter')overview?openGroup(d.id):showNode(d.id);});
const radius=d=>overview?Math.min(55,22+Math.sqrt(d.count)*2):Math.min(16,5+Math.sqrt(adj.get(d.id)?.length||0));
node.append('circle').attr('r',radius).attr('fill',d=>colors.get(overview?d.id:topic(d))||palette[0]).attr('fill-opacity',.85).attr('stroke','#bcece5').attr('stroke-opacity',.25);
node.append('title').text(d=>`${d.label} · ${overview?d.count+' node':(adj.get(d.id)?.length||0)+' koneksi'}`);
node.append('text').attr('text-anchor','middle').attr('y',d=>radius(d)+20).text(d=>overview?`${d.label} (${d.count})`:d.label.length>30?d.label.slice(0,29)+'…':d.label).classed('visible',d=>d.id===selected);
node.on('mouseenter',function(){d3.select(this).select('text').classed('visible',true);}).on('mouseleave',function(_,d){updateLabels(d3.zoomTransform(svg.node()).k);});
simulation=d3.forceSimulation(view).force('link',d3.forceLink(line.data()).id(d=>d.id).distance(110)).force('charge',d3.forceManyBody().strength(overview?-650:-130)).force('center',d3.forceCenter(rect.width/2,rect.height/2+25)).force('collision',d3.forceCollide().radius(d=>radius(d)+(overview?35:14)));
node.call(d3.drag().on('start',(e,d)=>{d.fx=d.x;d.fy=d.y;simulation.alphaTarget(.12).restart();}).on('drag',(e,d)=>{d.fx=e.x;d.fy=e.y;}).on('end',(e,d)=>{simulation.alphaTarget(released?.08:0);if(released){d.fx=null;d.fy=null;}}));
simulation.stop(); for(let i=0;i<250;i++)simulation.tick();
simulation.on('tick',()=>{line.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`);});line.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);node.attr('transform',d=>`translate(${d.x},${d.y})`);updateLabels(d3.zoomTransform(svg.node()).k);fit();$('status').textContent=overview?`${view.length} topik · pilih kelompok untuk menjelajah`:`${view.length} node · ${links.length} relasi · zoom untuk menampilkan nama`;}
function button(label,action){const b=document.createElement('button');b.className='item';b.textContent=label;b.onclick=action;return b;}
function overview(){released=false;$('unlock').setAttribute('aria-pressed','false');setMotionIcon(false);$('status').textContent='Memuat graph…';current=null;selected=null;$('search').value='';$('type').value='';$('title').textContent='Semua hubungan';$('detail').replaceChildren(...[...groups].sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>button(`${k} · ${v.length} node`,()=>openGroup(k))));render(nodes,edges,false);highlight(new Set(nodes.filter(n=>showIsolated||adj.get(n.id).length).map(n=>n.id)));}
function highlight(ids){layer.selectAll('.node').attr('opacity',d=>ids.has(d.id)?1:.18).attr('pointer-events',d=>ids.has(d.id)?'auto':'none');layer.selectAll('.edge').attr('opacity',d=>ids.has(endpoint(d.source))&&ids.has(endpoint(d.target))?1:.28);layer.selectAll('.node').classed('selected',d=>d.id===selected).classed('related',d=>ids.has(d.id)&&d.id!==selected);layer.selectAll('.node circle').attr('r',d=>Math.min(16,5+Math.sqrt(adj.get(d.id)?.length||0))*(d.id===selected?1.4:1));layer.selectAll('.edge').style('stroke',d=>selected&&(endpoint(d.source)===selected||endpoint(d.target)===selected)?'#66d9c4':null);updateLabels(d3.zoomTransform(svg.node()).k);}
function openGroup(k){current=k;highlight(new Set(groups.get(k).map(n=>n.id)));$('title').textContent=k;$('detail').textContent='Pilih node untuk melihat sumber dan koneksi. Gunakan pencarian untuk mempersempit hasil.';}
function filter(){const q=$('search').value.trim().toLowerCase(),t=$('type').value;const list=nodes.filter(n=>(!current||topic(n)===current)&&(!t||(n.type||'other')===t)&&(!q||`${n.label} ${n.id}`.toLowerCase().includes(q)));const ids=new Set(list.filter(n=>q||showIsolated||adj.get(n.id).length).map(n=>n.id));highlight(ids);if(q){$('title').textContent=`${list.length} hasil pencarian`;$('detail').replaceChildren(...list.slice(0,60).map(n=>button(n.label,()=>showNode(n.id))));}}
function showNode(id){const n=map.get(id);if(!n)return;selected=id;$('title').textContent=n.label;const source=document.createElement('p');source.className='path';source.textContent=n.id;const meta=document.createElement('p');meta.textContent=`${n.type||'other'} · ${adj.get(id).length} koneksi · kelompok ${topic(n)}`;const heading=document.createElement('h3');heading.textContent='Terhubung dengan';$('detail').replaceChildren(meta,source,heading,...adj.get(id).map(x=>button(map.get(x).label,()=>showNode(x))));const ids=new Set([id,...adj.get(id)]);highlight(ids);}
function find(q){q=q.toLowerCase();return nodes.find(n=>n.id.toLowerCase()===q||n.label.toLowerCase()===q)||nodes.find(n=>`${n.label} ${n.id}`.toLowerCase().includes(q));}
function run(){const q=$('query').value.trim();if(/^explain /i.test(q)){const n=find(q.slice(8));if(n)showNode(n.id);else $('status').textContent='Node tidak ditemukan';return;}const match=q.match(/^path (.+) to (.+)$/i);if(!match){$('search').value=q;current=null;filter();return;}const a=find(match[1]),b=find(match[2]);if(!a||!b){$('status').textContent='Node awal atau tujuan tidak ditemukan';return;}const queue=[a.id],prev=new Map([[a.id,null]]);for(let i=0;i<queue.length&&!prev.has(b.id);i++)for(const x of adj.get(queue[i]))if(!prev.has(x)){prev.set(x,queue[i]);queue.push(x);}if(!prev.has(b.id)){$('status').textContent='Tidak ada jalur';return;}const path=[];for(let x=b.id;x!==null;x=prev.get(x))path.push(x);path.reverse();const ids=new Set(path);highlight(ids);layer.selectAll('.edge').style('stroke',d=>ids.has(endpoint(d.source))&&ids.has(endpoint(d.target))?'#f2c879':null);$('title').textContent=`Jalur · ${path.length-1} langkah`;$('detail').replaceChildren(...path.map(id=>button(map.get(id).label,()=>showNode(id))));}
$('unlock').onclick=()=>{released=!released;$('unlock').setAttribute('aria-pressed',String(released));setMotionIcon(released);if(released){simulation.nodes().forEach(n=>{n.fx=null;n.fy=null;});simulation.alphaTarget(.08).alpha(.35).restart();}else{simulation.stop();simulation.alphaTarget(0);simulation.nodes().forEach(n=>{n.fx=n.x;n.fy=n.y;});}};$('reset').onclick=overview;$('isolated').onclick=()=>{showIsolated=!showIsolated;$('isolated').dataset.tip=showIsolated?'Sembunyikan node terisolasi':'Tampilkan node terisolasi';$('isolated').setAttribute('aria-label',$('isolated').dataset.tip);$('isolated').setAttribute('aria-pressed',String(showIsolated));filter();};$('home').onclick=()=>{current=null;selected=null;$('search').value='';$('type').value='';highlight(new Set(nodes.filter(n=>showIsolated||adj.get(n.id).length).map(n=>n.id)));};$('fit').onclick=fit;$('search').oninput=filter;$('type').onchange=filter;$('run').onclick=run;$('query').onkeydown=e=>{if(e.key==='Enter')run();};overview();
</script></html>
